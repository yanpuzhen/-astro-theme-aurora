name: RC validation

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migration and build assertions
        run: pnpm test

      - name: Run Astro check
        run: pnpm check

      - name: Build production output and Pagefind index
        run: pnpm build

      - name: Build bilingual documentation
        run: pnpm docs:build

      - name: Build combined Pages artifact
        run: pnpm pages:build

      - name: Verify Pages artifact
        run: pnpm test:pages

      - name: Verify README links and preview assets
        run: pnpm test:readme

      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Run standalone browser checks
        run: pnpm run test:browser

      - name: Run combined Pages browser checks
        run: pnpm run test:browser:pages
